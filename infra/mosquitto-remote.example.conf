# Exemplo para um servidor Linux com domínio e certificado TLS válidos.
# Ajuste caminhos e crie o arquivo de senhas usando mosquitto_passwd.
listener 8883
allow_anonymous false
password_file /etc/mosquitto/passwords
acl_file /etc/mosquitto/arcadeos.acl
certfile /etc/mosquitto/certs/fullchain.pem
keyfile /etc/mosquitto/certs/privkey.pem
tls_version tlsv1.2
persistence true
persistence_location /var/lib/mosquitto/
log_dest stdout
